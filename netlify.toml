# Netlify Configuration for Unified Cyber Defense Platform

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Cache Control to prevent browser caching stale JS bundles
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single Page Application (SPA) redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
